# Référentiel des régions et parcs du rapport hebdomadaire.
# Copier en parcs.toml (non versionné) et compléter.
# Les codes parc doivent être identiques aux noms des sites Mitti et au code
# entre parenthèses des feuilles « Travaux … (GP-XXX) ».
# Un site vu dans Mitti mais absent d'ici apparaît dans « Autres parcs ».

[[regions]]
nom = "Nord / IDF Est / Est"
responsable = "Carine"
parcs = ["GP-BOR", "GP-AUB", "GP-BRY", "GP-HEB", "GP-LON", "GP-MEA", "GP-MUL", "GP-VEN", "GP-WAM", "KF-TEU"]

[[regions]]
nom = "Ouest / IDF Ouest / Sud-Ouest"
responsable = "Cassandre"
parcs = ["GP-BEH", "GP-LHV", "GP-LMA", "GP-ROM", "GP-RCS", "GP-ROK"]
